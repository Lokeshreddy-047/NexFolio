name: NexFolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai-service/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: nexfolio_test
          MARKET_DATA_MODE: reference
          MARKET_DATA_PROVIDER: reference
        run: |
          pytest ai-service/tests -v --tb=short

  frontend-check:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Verify TypeScript Types
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_FIREBASE_API_KEY: mock-firebase-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mock-domain.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: mock-project-id
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: mock-bucket.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:mockappid"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-syntax-check:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
